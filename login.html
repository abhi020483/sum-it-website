<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sum-IT · Inloggen</title>
<link rel="icon" type="image/png" href="sum-it-favicon.png">
<script>/* Sum-IT backend config — Supabase.
   Fill these in with YOUR Supabase project values.
   The anon key is safe to expose publicly (it only allows what your
   Row Level Security policies allow: read content, and write only when
   logged in). Do NOT put the "service_role" key here. */
window.SB_URL  = 'https://kncruytvvqyrwxhgostc.supabase.co';        // e.g. https://abcdxyz.supabase.co
window.SB_ANON = 'sb_publishable_Okc2mW8gDttU9a6mjv56Fw_4k_mM7hN';   // the "anon / public" key
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
:root{--indigo:#2D2D6B;--indigo-d:#232358;--ink:#0F172A;--green:#00BC7D;--green-d:#007a55;--bg:#F1F5F9;--line:#E2E8F0;--slate:#64748B;--mut-d:rgba(255,255,255,.72);--line-d:rgba(255,255,255,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:linear-gradient(155deg,var(--indigo) 0%,var(--indigo-d) 100%);min-height:100vh;color:var(--ink);line-height:1.6}
.top{display:flex;align-items:center;gap:10px;padding:18px 24px;color:#fff}
.top img{width:40px;height:auto}.top b{font-size:17px;font-weight:800}.top .sp{flex:1}
.top a{color:var(--mut-d);font-size:13px;text-decoration:none;font-weight:600}
.langs{display:flex;border:1px solid var(--line-d);border-radius:999px;overflow:hidden;margin-right:6px}
.langs button{background:transparent;color:var(--mut-d);border:0;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:inherit}
.langs button.on{background:#fff;color:var(--indigo)}
.wrap{max-width:440px;margin:6vh auto 60px;padding:0 18px}
.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
h1{font-size:22px;font-weight:800;color:var(--indigo);margin-bottom:4px}
.sub{font-size:13.5px;color:var(--slate);margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:12px 14px;font-size:14.5px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-family:inherit}
input:focus{outline:2px solid var(--green)}
.btn{display:block;width:100%;text-align:center;background:var(--green);color:var(--c-on-green);font-weight:700;font-size:15px;padding:14px;border-radius:999px;border:0;cursor:pointer;font-family:inherit;margin-top:18px;box-shadow:0 10px 26px rgba(0,188,125,.35)}
.btn:disabled{opacity:.55}
.err{color:#C0263B;font-size:12.5px;min-height:18px;margin-top:10px}
.alt{font-size:13px;color:var(--slate);margin-top:16px;text-align:center}
.alt a{color:var(--green-d);font-weight:700;text-decoration:none}
.foot{color:var(--mut-d);font-size:12px;text-align:center;margin-top:22px}
.foot a{color:#fff}
</style>
<link rel="stylesheet" href="/components/footer/footer.css">
</head>
<body>
<div class="top">
  <img src="/sum-it-logo-mark.svg" alt=""><b>Sum-IT</b><span class="sp"></span>
  <div class="langs"><button id="lang-en" onclick="setLang('en')">EN</button><button id="lang-nl" onclick="setLang('nl')">NL</button></div>
  <a href="/">← sum-it.eu</a>
</div>
<div class="wrap">
  <div class="card">
    <h1 data-i18n="h1">Inloggen</h1>
    <div class="sub" data-i18n="sub">Voor members én beheerders. Log in met het e-mailadres van je Sum-IT-account.</div>
    <form id="f" onsubmit="return doLogin(event)">
      <label for="email" data-i18n="l_email">E-mailadres</label>
      <input id="email" type="email" required autocomplete="email" placeholder="jij@bedrijf.nl">
      <label for="pw" data-i18n="l_pw">Wachtwoord</label>
      <input id="pw" type="password" required autocomplete="current-password" minlength="12">
      <button class="btn" id="btn" type="submit" data-i18n="btn">Inloggen</button>
      <div class="err" id="err"></div>
      <div class="alt" style="margin-top:10px"><a href="/wachtwoord.html?request=1" onclick="rememberEmail()" data-i18n="forgot">Wachtwoord vergeten?</a></div>
    </form>
    <div class="alt" data-i18n="alt">Nog geen account? <a href="/portal.html">Maak er een in het member-portal</a></div>
  </div>
  <div class="foot"><span data-i18n="foot">Sum-IT is een product van Alpha Nova B.V. · Alle data in de EU</span> · <a href="/privacy.html">Privacy</a><!-- site-socials:start --><div class="site-socials is-dark"><a href="https://www.linkedin.com/company/sum-it-eu/" target="_blank" rel="noopener" title="LinkedIn" aria-label="Sum-IT · LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 6V21h-4v-5.5c0-1.3 0-3-1.9-3s-2.2 1.4-2.2 2.9V21H9z"/></svg></a><a href="https://www.instagram.com/sumit.eu/" target="_blank" rel="noopener" title="Instagram" aria-label="Sum-IT · Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9-.1-1.3-.1-1.6-.1-4.8s0-3.6.1-4.8C2.4 4 4 2.4 7.2 2.3c1.2-.1 1.6-.1 4.8-.1zM12 7a5 5 0 100 10 5 5 0 000-10zm0 8.2a3.2 3.2 0 110-6.4 3.2 3.2 0 010 6.4zm6.4-8.4a1.2 1.2 0 11-2.4 0 1.2 1.2 0 012.4 0z"/></svg></a><a href="https://x.com/SumITEurope" target="_blank" rel="noopener" title="X" aria-label="Sum-IT · X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L1.5 2H8l4.4 5.8zm-1.1 18h1.7L7 3.7H5.2z"/></svg></a></div><!-- site-socials:end --></div>
</div>
<script>
var I18N={
 nl:{h1:"Inloggen",sub:"Voor members én beheerders. Log in met het e-mailadres van je Sum-IT-account.",
     l_email:"E-mailadres",l_pw:"Wachtwoord",btn:"Inloggen",
     alt:'Nog geen account? <a href="/portal.html">Maak er een in het member-portal</a>',
     e_cfg:"Backend nog niet geconfigureerd.",e_conf:"Bevestig eerst je e-mailadres via de mail die je kreeg.",
     e_fail:"Inloggen mislukt: controleer e-mail en wachtwoord.",forgot:"Wachtwoord vergeten?",
     foot:"Sum-IT is een product van Alpha Nova B.V. · Alle data in de EU"},
 en:{h1:"Log in",sub:"For members and admins. Log in with the e-mail address of your Sum-IT account.",
     l_email:"E-mail address",l_pw:"Password",btn:"Log in",
     alt:'No account yet? <a href="/portal.html">Create one in the member portal</a>',
     e_cfg:"Backend not configured yet.",e_conf:"Please confirm your e-mail address first via the mail you received.",
     e_fail:"Login failed: check your e-mail and password.",forgot:"Forgot your password?",
     foot:"Sum-IT is a product of Alpha Nova B.V. · All data stays in the EU"}};
var LANG='nl';
function setLang(l){LANG=l;try{localStorage.setItem('sumit_lang',l);}catch(e){}
  document.documentElement.lang=l;
  document.getElementById('lang-en').classList.toggle('on',l==='en');
  document.getElementById('lang-nl').classList.toggle('on',l==='nl');
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');
    if(I18N[l][k]!==undefined)el.innerHTML=I18N[l][k];});
  document.getElementById('email').placeholder=l==='en'?'you@business.nl':'jij@bedrijf.nl';}
try{setLang(localStorage.getItem('sumit_lang')==='en'?'en':'nl');}catch(e){setLang('nl');}
var SB=null;
try{if(window.SB_URL&&window.SB_URL.indexOf('http')===0&&window.supabase){SB=window.supabase.createClient(window.SB_URL,window.SB_ANON);}}catch(e){}
async function routeUser(){
  try{
    var r=await SB.rpc('is_admin');
    /* ?next=/admin/... returns admins to the admin page they came from (same-site paths only). */
    var next=new URLSearchParams(location.search).get('next')||'';
    if(r.data===true){location.href=/^\/admin\/[\w\-\/]*(\?[\w\-=&%.]*)?$/.test(next)?next:'/beheer.html';return;}
  }catch(e){}
  location.href='/portal.html';
}
async function doLogin(ev){
  ev.preventDefault();
  var err=document.getElementById('err');err.textContent='';
  if(!SB){err.textContent=I18N[LANG].e_cfg;return false;}
  var btn=document.getElementById('btn');btn.disabled=true;
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pw=document.getElementById('pw').value;
  var r=await SB.auth.signInWithPassword({email:email,password:pw});
  btn.disabled=false;
  if(r.error){
    err.textContent=/confirm/i.test(r.error.message)?I18N[LANG].e_conf:I18N[LANG].e_fail;
    return false;
  }
  routeUser();
  return false;
}
/* "Wachtwoord vergeten?" opens the reset-request form on wachtwoord.html.
   A typed e-mail address is handed over via sessionStorage, never the URL. */
function rememberEmail(){
  try{sessionStorage.setItem('sumit_reset_email',(document.getElementById('email').value||'').trim());}catch(e){}
}
// already logged in? route straight away
if(SB){SB.auth.getSession().then(function(s){if(s.data&&s.data.session)routeUser();});}
</script>
</body>
</html>
